plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.quicktap.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.quicktap.pos"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.3.0"
        // ---- Fixed bootstrap endpoint (never remote controlled) -----------
        // Android -> bootstrap API -> Firebase config -> Remote Config
        //         -> api_base_url -> ApiClient -> self-hosted PHP API
        buildConfigField "String", "BOOTSTRAP_BASE_URL", "\"https://aifinzo.pro/api/\""
        // Application credentials issued by the Super Admin (api_clients).
        buildConfigField "String", "APP_ID", "\"app_41f7d123706a\""
        buildConfigField "String", "API_KEY", "\"a94791db4b426d74bccd78155b2b4eedc773488ee7b4c7d2\""
        vectorDrawables.useSupportLibrary true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions { resources.excludes += ['META-INF/*'] }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Fingerprint / device-credential unlock
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.2'

    // Background auto-sync
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Remote configuration only (endpoint routing) — never licence data.
    implementation 'com.google.firebase:firebase-common:20.4.2'
    implementation 'com.google.firebase:firebase-config:21.6.3'

    // Google Drive backup (appDataFolder, uploaded over plain REST)
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
